# Printed size of every panel, read by the figure notebook (to draw each panel at this
# size) and by the figure's .typ file (to place it). Change a size here, re-run the
# notebook, re-compile the figure.
#
# kind = "data": drawn by notebooks/manuscript_figures.py into <figure>/<panel>.svg
# kind = "schematic": drawn by hand (Inkscape) at this size, saved as <figure>/<panel>.svg

[fig1]
width_mm = 183
gap_mm = 4
rows = [["a", "b"], ["c"], ["d"], ["e"]]

[fig1.panels.a]
kind = "schematic"
width_mm = 112
height_mm = 71.2
what = "Rig rendering: head-fixed mouse on the wheel, front, face and side cameras, odor line (3d-vr-foraging FIG1_overview.svg)"

[fig1.panels.b]
kind = "data"
width_mm = 67
height_mm = 71.2
what = "One session: breathing rate and speed around odor onset per kind of site; breathing rate against speed"

[fig1.panels.c]
kind = "data"
width_mm = 183
height_mm = 34
what = "A minute of the same session: speed, breathing rate from video and thermistor, licks, odor sites"

[fig1.panels.d]
kind = "data"
width_mm = 183
height_mm = 36
what = "Network, read off the checkpoint: crops, frame encoder, resampling, TCN, heads"

[fig1.panels.e]
