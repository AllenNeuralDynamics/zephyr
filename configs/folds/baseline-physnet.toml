# PhysNet baseline (Yu et al., BMVC 2019) on the gray channel.  Settings are
# those of the reference runs in benchmarks/baselines-v1/physnet/runs; lr 3e-4
# was picked on the train split (see docs/baselines-report.md).  PhysNet's 3-D
# convolutions need the shorter window, and it is trained at one scale.
[[train]]
clips = "../clips/face_train.toml"

[test]
new_animals = "../clips/face_test_new_animals.toml"
known_animals_new_date = "../clips/face_test_known_animals_new_date.toml"

[train_params]
arch = "physnet"
channels = "gray"
window = 128
scales = [1]
lr = 3e-4
w_onset = 0.0
val_fraction = 0

[train_params.augmentation]
time_stretch = 1.0
select_jitter = 0.0
