[project]
name = "zephyr"
version = "0.1.0"
description = "CNN and temporal network for breathing prediction from video"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "scipy>=1.11",
    "torch>=2.6,<2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zephyr"]
