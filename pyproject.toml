[project]
name = "zephyr"
dynamic = ["version"]
description = "CNN and temporal network for breathing prediction from video"
authors = [{ name = "Allen Institute for Neural Dynamics" }]
keywords = ["breathing", "computer vision", "neural network", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "opencv-python-headless>=4.9",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "pydantic-settings>=2.6",
    "tomlkit>=0.13",
]

[project.optional-dependencies]
cpu = ["torch>=2.6,<2.8"]
gpu = ["torch>=2.6,<2.8"]

[project.scripts]
zephyr = "zephyr.cli:run"

[project.urls]
Repository = "https://github.com/AllenNeuralDynamics/zephyr"
Issues = "https://github.com/AllenNeuralDynamics/zephyr/issues"

[dependency-groups]
dev = ["ruff>=0.14", "pytest>=8.0"]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/zephyr/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zephyr"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]
