# uv workspace root (virtual: it is not a package itself).
#   packages/zephyr             -- the zephyr network; the only released package
#   packages/zephyr-benchmarks  -- benchmarks on our dataset and the comparison methods
#
#   uv sync --all-packages --extra cpu   # or --extra gpu

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
zephyr = { workspace = true }
zephyr-benchmarks = { workspace = true }

[dependency-groups]
dev = ["ruff>=0.14", "pytest>=8.0", "marimo>=0.14"]

[tool.uv]
conflicts = [
    [
        { package = "zephyr", extra = "cpu" },
        { package = "zephyr", extra = "gpu" },
    ],
    [
        { package = "zephyr-benchmarks", extra = "cpu" },
        { package = "zephyr-benchmarks", extra = "gpu" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["packages/zephyr/src", "packages/zephyr-benchmarks/src", "notebooks"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["B018", "PLR1711"]  # marimo cells end in the value they show

[tool.pytest.ini_options]
testpaths = ["packages/zephyr/tests", "packages/zephyr-benchmarks/tests", "notebooks/tests"]
# Both packages have test modules of the same name; importlib mode keeps them apart.
addopts = ["--import-mode=importlib"]
pythonpath = ["packages/zephyr/tests", "notebooks"]
