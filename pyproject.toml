# uv workspace root (virtual: it is not a package itself).
#   packages/zephyr             -- the zephyr network; the released package
#
# The paper (its manuscript, notebooks, benchmarks and the corpus build) lives in
# https://github.com/AllenNeuralDynamics/zephyr-manuscript, which pins zephyr.
#
#   uv sync --all-packages --extra cpu   # or --extra gpu

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
zephyr = { workspace = true }

[dependency-groups]
dev = ["ruff>=0.14", "pytest>=8.0"]

[tool.uv]
conflicts = [
    [
        { package = "zephyr", extra = "cpu" },
        { package = "zephyr", extra = "gpu" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["packages/zephyr/src"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["packages/zephyr/tests"]
addopts = ["--import-mode=importlib"]
pythonpath = ["packages/zephyr/tests"]
