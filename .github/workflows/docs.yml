name: Documentation

# Builds the site in docs/ with Zensical on every pull request that touches it, and
# publishes it to GitHub Pages from main.
on:
  pull_request:
    paths: ["docs/**", "overrides/**", "zensical.toml", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["docs/**", "overrides/**", "zensical.toml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.2.0

      - name: Build the site
        run: uvx zensical build --clean --strict

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
