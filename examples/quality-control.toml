# Example quality control: one <video stem>.qc.json per video, no thermistor needed.
#   zephyr preprocess examples/clips.toml --cache data/features-example
#   zephyr quality-control run examples/quality-control.toml
# Every [params] key is optional (see QualityParams in zephyr.config).

checkpoint = "../runs/example/fold/seed-42/best.pt"
reference = "../runs/example/fold/seed-42/qc-reference.json"   # optional: zephyr quality-control reference
features_dir = "../data/features-example"
output_dir = "../runs/example/quality-control"

[[clips]]
clips = "clips.toml"
groups = ["3"]                    # the held-out recording

[params]
window_s = 30.0
