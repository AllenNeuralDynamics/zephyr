# Example clip list: the first face clip of six sessions of zephyr's dataset, one
# session per animal (the documentation's tutorial downloads them into
# data/vr-foraging/). Paths are relative to this file. Make your own with
#   zephyr clips scan <dir> --glob '*_FaceCamera.mp4' -o <list.toml> --pattern ... --thermistor ...
# and place the boxes in the app (`zephyr gui <list.toml> --page boxes`).
# A clip may choose its own breathing-event detector next to its box, e.g.
#   events = { method = "adaptive_prominence", params = { prominence_frac = 0.3 } }
# (written for you by the app's Breathing page). timestamps, thermistor and group
# are derived from each video name by [derive]; give them explicitly when your files
# are named otherwise.

[preprocess]
target_size = [360, 270]          # frame size the boxes are measured in

[events]
method = "adaptive_prominence"
params = {highpass_hz = 1.0, distance_s = 0.05, prominence_frac = 0.2, window_s = 1.5}

[derive]                          # <session>_span<n>_FaceCamera.mp4, the session is the group
pattern = '(?P<group>.+)_span(?P<span>\d+)_FaceCamera$'
thermistor = "{group}_span{span}_thermistor.parquet"

[[clip]]
video = "../data/vr-foraging/behavior_789903_2025-10-29_20-06-45_span1_FaceCamera.mp4"
box = [230, 98, 96, 96]           # x, y, w, h in target_size pixels

