# Example quality-control reference: the onset head's calibration, measured once per
# checkpoint on labelled clips it never trained on, and shipped beside it.
#   zephyr quality-control reference examples/quality-reference.toml
# Without one, quality control still runs; only expected precision is left out.

checkpoint = "../runs/example/fold/seed-42/best.pt"
features_dir = "../data/features-example"
out = "../runs/example/fold/seed-42/qc-reference.json"

[[calibration]]                   # labelled, never trained on (e.g. the validation animals)
clips = "clips.toml"
groups = ["3"]
