# The published network baselines, two seeds each as in docs/baselines-report.md.
# A full run needs a GPU:
#   zephyr-benchmarks run packages/zephyr-benchmarks/configs/experiments/baselines-nets.toml
seeds = [17, 42]
output_dir = "../../../../runs/baselines-nets"
features_dir = "../../../../data/features-v2"
device = "cuda"
amp = "bf16"

[[fold]]
name = "baseline-tscan"
# TS-CAN baseline (Liu et al., NeurIPS 2020) on the gray channel, predicting the
# trace's forward difference.  Settings are those of the reference runs in
# benchmarks/baselines-v1/tscan/runs; lr 3e-3 was picked on the train split
# (see docs/baselines-report.md).  Frame-rate augmentation is off because the
# network's motion branch assumes a fixed frame rate.
[[fold.train]]
clips = "../clips/face_train.toml"

[fold.test]
new_animals = "../clips/face_test_new_animals.toml"
known_animals_new_date = "../clips/face_test_known_animals_new_date.toml"

[fold.train_params]
arch = "tscan"
channels = "gray"
tscan_img_size = 36
lr = 3e-3
w_onset = 0.0
val_fraction = 0

[fold.train_params.augmentation]
time_stretch = 1.0
select_jitter = 0.0

[[fold]]
name = "baseline-physnet"
# PhysNet baseline (Yu et al., BMVC 2019) on the gray channel.  Settings are
# those of the reference runs in benchmarks/baselines-v1/physnet/runs; lr 3e-4
# was picked on the train split (see docs/baselines-report.md).  PhysNet's 3-D
# convolutions need the shorter window, and it is trained at one scale.
[[fold.train]]
clips = "../clips/face_train.toml"

[fold.test]
new_animals = "../clips/face_test_new_animals.toml"
known_animals_new_date = "../clips/face_test_known_animals_new_date.toml"

[fold.train_params]
arch = "physnet"
channels = "gray"
window = 128
scales = [1]
lr = 3e-4
w_onset = 0.0
val_fraction = 0

[fold.train_params.augmentation]
time_stretch = 1.0
select_jitter = 0.0
