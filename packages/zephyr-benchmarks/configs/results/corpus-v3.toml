# Quality-control scores of the all-camera network of cv_0 (reference on 60 clips of its
# validation animals), written on this machine under $ZEPHYR_QC_ROOT by `zephyr predict
# --quality-control` (the noise null by `zephyr-benchmarks probe`; Figs. 4 and 5); the
# refined network's reports were made with its own reference. The truth they are
# checked against is joined by the report, never read by quality control.
[quality]
reference = "ref-allcam.json"

[[quality.set]]
label = "Held-out animals"
reports = "vr"
role = "working"

[[quality.set]]
label = "Dynamic foraging, refined"
reports = "df-refined"
role = "working"

[[quality.set]]
label = "Dynamic foraging, unrefined"
reports = "df-unrefined"
role = "null"

[[quality.set]]
label = "Noise 16"
reports = "noise"
role = "null"
noise = 16

[[quality.set]]
label = "Noise 32"
reports = "noise"
role = "null"
noise = 32

[[quality.set]]
label = "Noise 64"
reports = "noise"
role = "null"
noise = 64

[[quality.set]]
label = "Sessions without a thermistor"
reports = "application-face"
role = "application"
camera = "Face camera"

[[quality.set]]
label = "Sessions without a thermistor, side camera"
reports = "application-side"
role = "camera"
camera = "Side camera"

[[quality.set]]
label = "Sessions without a thermistor, front camera"
reports = "application-front"
role = "camera"
camera = "Front camera"
