# Every video of the benchmark in one list, to check and tune the breathing-event
# detector of each at once: `uv run zephyr annotate events <this file>`.
# Built from: face_train.toml, face_test_known_animals_new_date.toml, face_test_new_animals.toml, ood_side_right.toml.
# Not a training or test list: use the originals for folds.

[preprocess]
target_size = [360, 270]

