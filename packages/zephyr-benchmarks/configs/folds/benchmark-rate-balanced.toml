# benchmark-gray-diff-flow-multitask with training windows drawn evenly over the
# true breathing rate (rate_balance = 1, default 2-15 Hz bins) and time stretching
# off, so the run isolates the effect of balancing the real data.
[[train]]
clips = "../clips/face_train.toml"

[test]
new_animals = "../clips/face_test_new_animals.toml"
known_animals_new_date = "../clips/face_test_known_animals_new_date.toml"

[train_params]
channels = "gray+diff+flow"
epochs = 200
steps_per_epoch = 200
val_fraction = 0
w_corr = 1.0
w_onset = 0.5
rate_balance = 1.0

[train_params.augmentation]
time_stretch = 1.0
