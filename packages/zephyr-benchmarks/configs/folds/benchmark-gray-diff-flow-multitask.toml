# The high-F1 benchmark network: gray + diff + flow input, signal + onset
# objective, trained on every labelled face clip with a fixed budget (no
# validation, no early stopping) and scored on two test groups.
[[train]]
clips = "../clips/face_train.toml"

[test]
new_animals = "../clips/face_test_new_animals.toml"
known_animals_new_date = "../clips/face_test_known_animals_new_date.toml"

[train_params]
channels = "gray+diff+flow"
epochs = 200
steps_per_epoch = 200
val_fraction = 0
w_corr = 1.0
w_onset = 0.5
